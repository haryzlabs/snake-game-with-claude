<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0820">
<title>Neon Snake</title>
<style>
  :root {
    --night: #0E0820;
    --board: #130B2B;
    --wall: #7A5CFF;
    --text: #EDE6FF;
    --muted: #A99CCB;
    --spark: #FFC53D;
    --ion: #FF3D9A;
    --argon: #4DE8FF;
    --size: min(calc(100vw - 32px), calc(100vh - 104px), 640px);
    --size: min(calc(100vw - 32px), calc(100dvh - 104px), 640px);
    font-family: ui-rounded, "SF Pro Rounded", Nunito, "Varela Round", "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
    color: var(--text);
    background: radial-gradient(120% 90% at 50% 45%, #1E1145 0%, var(--night) 62%);
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  .hud {
    display: flex;
    align-items: center;
    gap: clamp(18px, 6vw, 36px);
    width: var(--size);
    min-height: 50px;
  }

  .stat { display: flex; flex-direction: column; }
  .stat span { font-size: 13px; line-height: 1.2; color: var(--muted); }
  .stat strong {
    font-size: 24px;
    line-height: 1.2;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  button {
    font: inherit;
    font-weight: 700;
    color: inherit;
    cursor: pointer;
    border-radius: 999px;
    transition: box-shadow 120ms ease, background-color 120ms ease, opacity 120ms ease;
  }

  button:focus-visible {
    outline: 3px solid var(--argon);
    outline-offset: 3px;
  }

  #pause {
    margin-left: auto;
    min-height: 40px;
    padding: 0 18px;
    font-size: 15px;
    background: transparent;
    border: 2px solid var(--wall);
  }
  #pause:hover:enabled { box-shadow: 0 0 14px rgba(122, 92, 255, .7); }
  #pause:disabled { opacity: .4; cursor: default; }

  .board {
    position: relative;
    flex: none;
    width: var(--size);
    height: var(--size);
    border: 2px solid var(--wall);
    border-radius: 8px;
    box-shadow:
      0 0 10px rgba(122, 92, 255, .75),
      0 0 44px rgba(122, 92, 255, .28),
      inset 0 0 22px rgba(122, 92, 255, .18);
    overflow: hidden;
    background: var(--board);
  }

  canvas { display: block; width: 100%; height: 100%; }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 20px;
    text-align: center;
    background: rgba(14, 8, 32, .55);
  }
  .overlay[hidden] { display: none; }

  /* The start screen's title is a neon tube drawn on the canvas above this text. */
  .overlay.is-start {
    justify-content: flex-start;
    padding-top: 39%;
    background: transparent;
  }
  .overlay.is-start h2 { display: none; }

  .overlay h2 {
    margin: 0;
    font-size: clamp(32px, 9vw, 52px);
    line-height: 1.1;
    font-weight: 800;
    color: #FFE3F1;
    text-shadow: 0 0 6px var(--ion), 0 0 22px var(--ion), 0 0 48px rgba(255, 61, 154, .6);
  }

  .overlay p {
    margin: 0;
    max-width: 34ch;
    font-size: clamp(14px, 3.6vw, 17px);
    line-height: 1.45;
    color: var(--text);
  }
  .overlay p:empty { display: none; }

  #action {
    margin-top: 6px;
    min-height: 48px;
    padding: 0 30px;
    font-size: 18px;
    color: #241302;
    background: var(--spark);
    border: 0;
    box-shadow: 0 0 18px rgba(255, 197, 61, .5);
  }
  #action:hover { box-shadow: 0 0 30px rgba(255, 197, 61, .85); }

  .keys { display: inline; }
  .touch { display: none; }
  @media (pointer: coarse) {
    .keys { display: none; }
    .touch { display: inline; }
  }

  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
  }
</style>
</head>
<body>
  <h1 class="visually-hidden">Neon Snake</h1>

  <header class="hud">
    <div class="stat"><span>Score</span><strong id="score">0</strong></div>
    <div class="stat"><span>Best</span><strong id="best">0</strong></div>
    <div class="stat"><span>Speed</span><strong id="speed">1.0×</strong></div>
    <button id="pause" type="button" disabled>Pause</button>
  </header>

  <main class="board">
    <canvas id="game" role="img" aria-label="Snake game board"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="overlay-title"></h2>
      <p id="overlay-text" aria-live="polite"></p>
      <p id="overlay-help"></p>
      <button id="action" type="button"></button>
    </div>
  </main>

<script>
(() => {
  "use strict";

  const GRID = 22;
  const START_STEP_MS = 150;
  const MIN_STEP_MS = 62;
  const SPEEDUP_PER_FOOD = 0.975;
  const POINTS_PER_FOOD = 10;
  const DEATH_MS = 900;
  const SWIPE_PX = 22;
  const BEST_KEY = "neon-snake-best";

  const DIRS = {
    up: { x: 0, y: -1 },
    down: { x: 0, y: 1 },
    left: { x: -1, y: 0 },
    right: { x: 1, y: 0 },
  };
  const KEY_DIRS = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    KeyW: "up", KeyS: "down", KeyA: "left", KeyD: "right",
  };

  // Title letters, as tube strokes on a 4×6 unit box.
  const LETTERS = [
    [[[4, 0], [0, 0], [0, 3], [4, 3], [4, 6], [0, 6]]],
    [[[0, 6], [0, 0], [4, 6], [4, 0]]],
    [[[0, 6], [0, 0], [4, 0], [4, 6]], [[0, 3], [4, 3]]],
    [[[0, 0], [0, 6]], [[4, 0], [0, 3], [4, 6]]],
    [[[4, 0], [0, 0], [0, 6], [4, 6]], [[0, 3], [3.4, 3]]],
  ];

  const el = (id) => document.getElementById(id);
  const canvas = el("game");
  const ctx = canvas.getContext("2d");
  const board = canvas.parentElement;
  const ui = {
    score: el("score"), best: el("best"), speed: el("speed"), pause: el("pause"),
    overlay: el("overlay"), title: el("overlay-title"), text: el("overlay-text"),
    help: el("overlay-help"), action: el("action"),
  };

  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

  const S = {
    phase: "start", // start | playing | paused | dying | over
    body: [],
    dir: DIRS.right,
    queue: [],
    food: null,
    eatenFood: null,
    prevTail: null,
    grew: false,
    score: 0,
    eaten: 0,
    best: loadBest(),
    bestBeaten: false,
    acc: 0,
    lastFrame: 0,
    deathAt: 0,
    titleAt: 0,
    particles: [],
  };

  /* Storage: may be unavailable in private windows, so failures are ignored. */

  function loadBest() {
    try {
      const n = parseInt(localStorage.getItem(BEST_KEY), 10);
      return Number.isFinite(n) && n > 0 ? n : 0;
    } catch {
      return 0;
    }
  }

  function saveBest(value) {
    try {
      localStorage.setItem(BEST_KEY, String(value));
    } catch { /* The best score then lasts for this visit only. */ }
  }

  /* Rules */

  const stepMs = () =>
    Math.max(MIN_STEP_MS, START_STEP_MS * Math.pow(SPEEDUP_PER_FOOD, S.eaten));

  const same = (a, b) => a.x === b.x && a.y === b.y;

  function newGame() {
    const y = Math.floor(GRID / 2);
    S.body = [6, 5, 4, 3].map((x) => ({ x, y }));
    S.prevTail = { x: 2, y };
    S.dir = DIRS.right;
    S.queue = [];
    S.eatenFood = null;
    S.grew = false;
    S.score = 0;
    S.eaten = 0;
    S.bestBeaten = false;
    S.acc = 0;
    S.particles = [];
    S.food = pickFoodCell();
    S.phase = "playing";
    updateHud();
    hideOverlay();
  }

  function pickFoodCell() {
    const taken = new Set(S.body.map((c) => c.x + c.y * GRID));
    const free = [];
    for (let i = 0; i < GRID * GRID; i++) {
      if (!taken.has(i)) free.push(i);
    }
    if (!free.length) return null;
    const i = free[Math.floor(Math.random() * free.length)];
    return { x: i % GRID, y: Math.floor(i / GRID) };
  }

  /** Queues a turn, so two quick presses take effect on consecutive steps. */
  function steer(name) {
    if (S.phase !== "playing" || S.queue.length >= 2) return;
    const next = DIRS[name];
    const from = S.queue[S.queue.length - 1] || S.dir;
    if (next === from || (next.x === -from.x && next.y === -from.y)) return;
    S.queue.push(next);
  }

  function tick() {
    // The drawn head arrives at a food cell one step after the rules reach it.
    if (S.eatenFood) {
      burst(S.eatenFood);
      S.eatenFood = null;
    }

    if (S.queue.length) S.dir = S.queue.shift();

    const head = S.body[0];
    const next = { x: head.x + S.dir.x, y: head.y + S.dir.y };
    const eating = S.food !== null && same(next, S.food);
    const solid = eating ? S.body : S.body.slice(0, -1);

    const hitWall = next.x < 0 || next.y < 0 || next.x >= GRID || next.y >= GRID;
    if (hitWall || solid.some((c) => same(c, next))) {
      die();
      return;
    }

    S.body.unshift(next);
    S.grew = eating;
    S.prevTail = eating ? null : S.body.pop();

    if (eating) {
      S.eatenFood = S.food;
      S.eaten += 1;
      S.score += POINTS_PER_FOOD;
      if (S.score > S.best) {
        S.best = S.score;
        S.bestBeaten = true;
        saveBest(S.best);
      }
      updateHud();
      S.food = pickFoodCell();
      if (!S.food) finish("Board filled");
    }
  }

  function die() {
    S.acc = stepMs(); // Hold the tube at its final position.
    if (reducedMotion.matches) {
      finish("Game over");
    } else {
      S.phase = "dying";
      S.deathAt = performance.now();
      ui.pause.disabled = true;
    }
  }

  function finish(title) {
    S.phase = "over";
    const summary = S.bestBeaten
      ? `New best score: ${S.score}.`
      : `You scored ${S.score}. Your best is ${S.best}.`;
    showOverlay(title, summary, "", "Play again");
  }

  function setPaused(paused) {
    if (paused && S.phase === "playing") {
      S.phase = "paused";
      showOverlay("Paused", "", "", "Resume");
    } else if (!paused && S.phase === "paused") {
      S.phase = "playing";
      hideOverlay();
    }
  }

  function primaryAction() {
    if (S.phase === "paused") setPaused(false);
    else if (S.phase === "start" || S.phase === "over") newGame();
  }

  /* Interface */

  function updateHud() {
    ui.score.textContent = S.score;
    ui.best.textContent = S.best;
    ui.speed.textContent = `${(START_STEP_MS / stepMs()).toFixed(1)}×`;
  }

  function showOverlay(title, text, helpHtml, action) {
    ui.title.textContent = title;
    ui.text.textContent = text;
    ui.help.innerHTML = helpHtml;
    ui.action.textContent = action;
    ui.overlay.classList.toggle("is-start", S.phase === "start");
    ui.overlay.hidden = false;
    ui.pause.disabled = true;
    if (!matchMedia("(pointer: coarse)").matches) ui.action.focus({ preventScroll: true });
  }

  function hideOverlay() {
    ui.overlay.hidden = true;
    ui.pause.disabled = false;
  }

  /* Drawing. Everything is in grid cells; the transform handles scale. */

  let backdrop = null;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const px = Math.round(canvas.clientWidth * dpr);
    if (!px) return;
    if (canvas.width !== px) {
      canvas.width = px;
      canvas.height = px;
    }
    backdrop = paintBackdrop(px);
  }

  function paintBackdrop(px) {
    const off = document.createElement("canvas");
    off.width = off.height = px;
    const c = off.getContext("2d");
    const k = px / GRID;
    c.fillStyle = "#130B2B";
    c.fillRect(0, 0, px, px);
    c.fillStyle = "#30245C";
    for (let y = 0; y < GRID; y++) {
      for (let x = 0; x < GRID; x++) {
        c.beginPath();
        c.arc((x + 0.5) * k, (y + 0.5) * k, Math.max(0.8, k * 0.045), 0, Math.PI * 2);
        c.fill();
      }
    }
    return off;
  }

  /** Builds a path that bends around corners like glass tubing. */
  function tubePath(points, bend) {
    const path = new Path2D();
    const first = points[0];
    path.moveTo(first.x, first.y);
    for (let i = 1; i < points.length - 1; i++) {
      const a = points[i - 1];
      const b = points[i];
      const c = points[i + 1];
      const r = Math.min(bend, Math.hypot(b.x - a.x, b.y - a.y) / 2, Math.hypot(c.x - b.x, c.y - b.y) / 2);
      path.arcTo(b.x, b.y, c.x, c.y, r);
    }
    const last = points[points.length - 1];
    path.lineTo(last.x + 1e-4, last.y);
    return path;
  }

  function strokeLit(path, color, width, brightness = 1) {
    ctx.save();
    ctx.lineCap = ctx.lineJoin = "round";
    ctx.strokeStyle = color;
    ctx.globalCompositeOperation = "lighter";
    for (const [scale, alpha] of [[2.8, 0.07], [1.9, 0.12], [1.35, 0.2]]) {
      ctx.lineWidth = width * scale;
      ctx.globalAlpha = alpha * brightness;
      ctx.stroke(path);
    }
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = brightness;
    ctx.lineWidth = width;
    ctx.stroke(path);
    ctx.strokeStyle = "#FFFFFF";
    ctx.globalAlpha = 0.8 * brightness;
    ctx.lineWidth = width * 0.34;
    ctx.stroke(path);
    ctx.restore();
  }

  function strokeDark(path, width) {
    ctx.save();
    ctx.lineCap = ctx.lineJoin = "round";
    ctx.strokeStyle = "#3A2F5E";
    ctx.lineWidth = width;
    ctx.stroke(path);
    ctx.strokeStyle = "#544A7A";
    ctx.lineWidth = width * 0.22;
    ctx.stroke(path);
    ctx.restore();
  }

  /** Tube colour runs from argon blue at full length to hot pink at top speed. */
  function tubeColor() {
    const f = (START_STEP_MS - stepMs()) / (START_STEP_MS - MIN_STEP_MS);
    return `hsl(${188 + f * 143} 100% 64%)`;
  }

  /** The tube's centre line, with both ends sliding between cells. */
  function snakePoints() {
    const moving = S.phase === "playing" || S.phase === "paused";
    const t = moving ? Math.min(S.acc / stepMs(), 1) : 1;
    const centre = (c) => ({ x: c.x + 0.5, y: c.y + 0.5 });
    const mix = (a, b) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });

    const pts = S.body.slice(1).map(centre);
    pts.unshift(mix(pts[0], centre(S.body[0])));
    if (S.prevTail) pts.push(mix(centre(S.prevTail), pts[pts.length - 1]));
    return pts;
  }

  function drawSnake(now) {
    const pts = snakePoints();
    const width = 0.62;
    const bend = 0.42;
    const whole = tubePath(pts, bend);

    if (S.phase === "over") {
      strokeDark(whole, width);
    } else if (S.phase === "dying") {
      // The tube goes out from the head towards the tail, flickering as it fails.
      const p = (now - S.deathAt) / DEATH_MS;
      strokeDark(whole, width);
      const from = Math.floor(p * pts.length);
      if (from < pts.length - 1) {
        const flicker = Math.sin(now * 0.07) * Math.sin(now * 0.031) > 0.1 ? 0.55 : 1;
        strokeLit(tubePath(pts.slice(from), bend), tubeColor(), width, flicker);
      }
    } else {
      strokeLit(whole, tubeColor(), width);
    }

    if (S.phase === "playing" || S.phase === "paused") {
      const h = pts[0];
      const d = S.dir;
      ctx.fillStyle = "#130B2B";
      for (const side of [-1, 1]) {
        ctx.beginPath();
        ctx.arc(h.x + d.x * 0.1 - d.y * side * 0.15, h.y + d.y * 0.1 + d.x * side * 0.15, 0.07, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawFood(cell, now) {
    const x = cell.x + 0.5;
    const y = cell.y + 0.5;
    const pulse = reducedMotion.matches ? 0 : Math.sin(now * 0.006) * 0.025;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = "#FFC53D";
    for (const [r, a] of [[0.72, 0.08], [0.5, 0.16], [0.34, 0.3]]) {
      ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.arc(x, y, r + pulse * 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    ctx.fillStyle = "#FFC53D";
    ctx.beginPath();
    ctx.arc(x, y, 0.27 + pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#FFF4D2";
    ctx.beginPath();
    ctx.arc(x, y, 0.13, 0, Math.PI * 2);
    ctx.fill();
  }

  function burst(cell) {
    if (reducedMotion.matches) return;
    for (let i = 0; i < 14; i++) {
      const angle = (i / 14) * Math.PI * 2 + Math.random() * 0.4;
      const speed = 3 + Math.random() * 5;
      S.particles.push({
        x: cell.x + 0.5,
        y: cell.y + 0.5,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
      });
    }
  }

  function drawParticles(dt) {
    const seconds = dt / 1000;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = "#FFC53D";
    S.particles = S.particles.filter((p) => {
      p.life -= seconds * 2.4;
      if (p.life <= 0) return false;
      p.x += p.vx * seconds;
      p.y += p.vy * seconds;
      ctx.globalAlpha = p.life;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 0.1, 0, Math.PI * 2);
      ctx.fill();
      return true;
    });
    ctx.restore();
  }

  /** The title lights up letter by letter, once, when the page opens. */
  function drawTitle(now) {
    const unit = (GRID * 0.82) / 24.2;
    const letterWidth = 0.85; // Narrows the 4-unit letter box to 3.4 units.
    const left = GRID * 0.09;
    const top = GRID * 0.1;
    const width = unit * 0.72;
    const elapsed = reducedMotion.matches ? Infinity : now - S.titleAt;

    LETTERS.forEach((strokes, i) => {
      const x0 = left + i * unit * 5.2;
      const on = elapsed - (250 + i * 170);
      // Sharp diagonals (N, K) need a tight bend or the tube curls into a loop.
      const bend = unit * (i === 1 || i === 3 ? 0.12 : 0.8);
      for (const stroke of strokes) {
        const path = tubePath(stroke.map(([x, y]) => ({ x: x0 + x * letterWidth * unit, y: top + y * unit })), bend);
        strokeDark(path, width);
        if (on < 0) continue;
        const flickering = on < 320 && Math.sin(on * 0.09) < 0;
        if (!flickering) strokeLit(path, "#FF3D9A", width);
      }
    });
  }

  function render(now, dt) {
    if (!backdrop) return;
    const k = canvas.width / GRID;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(backdrop, 0, 0);
    ctx.setTransform(k, 0, 0, k, 0, 0);

    if (S.phase === "start") {
      drawTitle(now);
      return;
    }
    if (S.eatenFood) drawFood(S.eatenFood, now);
    if (S.food) drawFood(S.food, now);
    drawSnake(now);
    drawParticles(dt);
  }

  function frame(now) {
    const dt = Math.min(now - S.lastFrame, 100);
    S.lastFrame = now;

    if (S.phase === "playing") {
      S.acc += dt;
      while (S.phase === "playing" && S.acc >= stepMs()) {
        S.acc -= stepMs();
        tick();
      }
    } else if (S.phase === "dying" && now - S.deathAt >= DEATH_MS) {
      finish("Game over");
    }

    render(now, dt);
    requestAnimationFrame(frame);
  }

  /* Input */

  addEventListener("keydown", (e) => {
    const dir = KEY_DIRS[e.code];
    if (dir) {
      e.preventDefault();
      if (!e.repeat) steer(dir);
      return;
    }

    if (e.code !== "Space" && e.code !== "Enter") return;
    // A focused button handles these keys itself and raises its own click.
    if (e.target instanceof HTMLButtonElement) return;
    e.preventDefault();
    if (e.repeat) return;
    if (e.code === "Space" && S.phase === "playing") setPaused(true);
    else primaryAction();
  });

  ui.action.addEventListener("click", primaryAction);
  ui.pause.addEventListener("click", () => {
    setPaused(true);
    ui.pause.blur();
  });

  // Swipes steer as soon as they pass the threshold, then re-anchor,
  // so one continuous drag can make several turns.
  let touchAnchor = null;

  addEventListener("touchstart", (e) => {
    const t = e.changedTouches[0];
    touchAnchor = { id: t.identifier, x: t.clientX, y: t.clientY };
  }, { passive: true });

  addEventListener("touchmove", (e) => {
    if (S.phase !== "playing") return;
    e.preventDefault();
    if (!touchAnchor) return;
    const t = [...e.changedTouches].find((c) => c.identifier === touchAnchor.id);
    if (!t) return;
    const dx = t.clientX - touchAnchor.x;
    const dy = t.clientY - touchAnchor.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < SWIPE_PX) return;
    if (Math.abs(dx) > Math.abs(dy)) steer(dx > 0 ? "right" : "left");
    else steer(dy > 0 ? "down" : "up");
    touchAnchor.x = t.clientX;
    touchAnchor.y = t.clientY;
  }, { passive: false });

  addEventListener("touchend", () => { touchAnchor = null; });
  addEventListener("touchcancel", () => { touchAnchor = null; });

  addEventListener("blur", () => setPaused(true));
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) setPaused(true);
  });

  new ResizeObserver(resize).observe(canvas);

  /* Start */

  function init() {
    resize();
    updateHud();
    showOverlay(
      "Neon Snake",
      "Eat the sparks to grow and speed up. Walls and your own tail end the run.",
      '<span class="keys">Steer with the arrow keys or WASD. Press Space to pause.</span>' +
        '<span class="touch">Swipe anywhere to steer.</span>',
      "Start game"
    );
    S.lastFrame = S.titleAt = performance.now();
    requestAnimationFrame(frame);
  }

  init();
})();
</script>
</body>
</html>
